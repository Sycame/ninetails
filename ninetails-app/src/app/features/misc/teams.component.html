<h1>Teams</h1>
<div class="grid">
  @for (t of teams$ | async; track t.team.id) {
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-card-title>{{ t.team.name }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-chip-set>
          @for (e of t.envs; track e.id) {
            <mat-chip [routerLink]="['/envs', e.id]">{{ e.name }}</mat-chip>
          }
        </mat-chip-set>
      </mat-card-content>
      <mat-card-actions>
        <a mat-button routerLink="/envs" [queryParams]="{ team: t.team.id }">Filter environments</a>
      </mat-card-actions>
    </mat-card>
  }
</div>
